<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ジョージで学ぶ話さがし</title>
<meta name="theme-color" content="#f7c600">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジョージ学び">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: やさしく頼れる、親向けの道具。子どもっぽくしすぎない
   IDEA: 絵本の図書館の「さがしもの棚」——目的のラベルから本を抜き出す
   PICTURE: 黄色い帽子の帯の下、目的ラベルの棚そのものが主役
   COLOUR/TYPE: 帽子の黄色が主、ジョージの茶色が支え、白地。M PLUS Rounded 1c
   LAYOUT: 帯→目的の棚→絞り込み→結果カードのグリッド。600px以下は1列 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17110c);--ink:light-dark(#24180f,#f4ebdf);--sub:light-dark(#6d5b4b,#bba996);
--hat:#f7c600;--hatink:#2a1d00;--fur:light-dark(#7a4a24,#d39a63);--line:light-dark(#ebe3d7,#3a2e24);
--card:light-dark(#ffffff,#21180f);--soft:light-dark(#fff5c7,#30260f);--chip:light-dark(#f6f1ea,#2a2017)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--hat);color:var(--hatink)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:18px 16px}
header svg{flex:none;width:56px;height:56px;border-radius:14px;box-shadow:0 2px 6px rgba(60,35,10,.25)}
h1{margin:0;font-size:clamp(22px,3.2vw,32px);line-height:1.15;font-weight:800;text-wrap:balance}
header p{margin:2px 0 0;font-size:14px}
h2{font-size:clamp(20px,2.4vw,26px);margin:28px 0 12px;font-weight:800;line-height:1.2}
h2 small{font-size:14px;font-weight:500;color:var(--sub);margin-left:8px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:10px}
.pur{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;min-height:60px;padding:10px 14px;border:2px solid var(--line);
 border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;transition:transform .15s}
.pur span{white-space:nowrap;font-size:13px;font-weight:500;color:var(--sub)}
.pur[aria-pressed=true]{background:var(--hat);border-color:var(--hat);color:var(--hatink)}
.pur[aria-pressed=true] span{color:var(--hatink)}
.pur:hover{transform:translateY(-2px)}
.pur:disabled{opacity:.4;cursor:default;transform:none}
.grp{margin-top:18px}
.grp h3{margin:0 0 8px;font-size:16px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fur);border-color:var(--fur);color:#fff}
.chip span{white-space:nowrap;font-size:12px;opacity:.75;margin-left:4px}
.row{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
input[type=search],select{min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fur);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:24px}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.count{font-weight:800;font-size:20px;margin-right:auto}
.count small{font-size:14px;font-weight:500;color:var(--sub)}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:none;background:var(--fur);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;padding-block:18px 48px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card)}
.card.hl{outline:4px solid var(--hat);animation:pop .6s}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.card.hl{animation:none}.pur{transition:none}}
.meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta b{color:var(--ink)}
.card h3{margin:0;font-size:20px;line-height:1.3;font-weight:800}
.en{font-size:13px;color:var(--sub);margin-top:-4px}
.theme{margin:2px 0 0;font-weight:700;color:var(--fur)}
.syn{margin:0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip)}
.note{margin:4px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px}
.note b{margin-right:4px}
.pv{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:44px;margin-top:auto;padding:8px 12px;border-radius:10px;background:#00a8e1;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.pv small{font-weight:500;font-size:13px;opacity:.95}
.pv:hover{filter:brightness(1.08)}
.pv:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pv+.act{margin-top:0}
.act{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.act button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.act button[aria-pressed=true]{background:var(--soft);border-color:var(--hat);font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--sub)}
footer{border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
footer .wrap{padding-block:18px 28px}
[hidden]{display:none!important}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row .q{grid-column:1/-1}header svg{width:44px;height:44px;border-radius:11px}}
</style>
</head>
<body>
<header><div class="wrap">
<svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c5a2c"/><stop offset="1" stop-color="#5f3818"/></linearGradient><linearGradient id="hc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe45c"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#e9b800"/></linearGradient></defs><rect width="512" height="512" fill="url(#hg)"/><ellipse cx="236" cy="352" rx="196" ry="40" fill="#3f2410" opacity=".35"/><ellipse cx="236" cy="340" rx="196" ry="40" fill="#e0ad00"/><path d="M136 338 C130 258 142 178 182 128 C206 98 224 82 236 66 C248 82 266 98 290 128 C330 178 342 258 336 338 Q236 358 136 338 Z" fill="url(#hc)"/><path d="M136 338 Q236 358 336 338 L334 298 Q236 318 138 298 Z" fill="#a87400"/><path d="M176 262 C176 206 190 160 222 112" stroke="#fff6bf" stroke-width="14" fill="none" stroke-linecap="round"/><line x1="412" y1="414" x2="456" y2="458" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/><circle cx="366" cy="368" r="62" fill="#ffffff" fill-opacity=".22" stroke="#ffffff" stroke-width="20"/><path d="M338 346 Q350 330 370 328" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/></svg>
<div><h1>ジョージで学ぶ 話さがし</h1><p>学ばせたいことから、おさるのジョージの話を探せます（全389話）</p></div>
</div></header>

<main>
<div class="wrap">
<h2>何を学ばせたい？<small>いくつでも選べます</small></h2>
<div class="shelf" id="purposes"></div>

<div class="grp"><h3>こんなときに（生活の困りごと）</h3><div class="chips" id="komari"></div></div>
<div class="grp"><h3>季節・行事</h3><div class="chips" id="season"></div></div>

<div class="row">
<label class="f q">ことばで探す<input type="search" id="q" placeholder="例：磁石、時計、ハロウィン、恐竜" autocomplete="off"></label>
<label class="f">対象年齢<select id="age"><option value="">すべて</option><option value="3">3歳から見られる話</option><option value="4">4歳以上向けの話</option></select></label>
<label class="f">キャラクター<select id="chr"><option value="">すべて</option></select></label>
<label class="f">シーズン<select id="ssn"><option value="">すべて</option></select></label>
</div>
<div class="toggles">
<button class="chip" id="tHome" aria-pressed="false">家でできる実験・工作がある</button>
<button class="chip" id="tWorld" aria-pressed="false">海外が舞台</button>
<button class="chip" id="tUnseen" aria-pressed="false">まだ見ていない話だけ</button>
<button class="chip" id="tFav" aria-pressed="false">お気に入りだけ</button>
</div>
</div>

<div class="bar"><div class="wrap">
<div class="count" id="count"></div>
<label class="f" style="flex-direction:row;align-items:center;gap:6px">並び順<select id="sort"><option value="ep">放送順</option><option value="new">新しい順</option><option value="rnd">ランダム</option></select></label>
<button class="btn" id="pick">おまかせで1話</button>
<button class="btn ghost" id="clear">条件をクリア</button>
</div></div>

<div class="wrap"><div class="results" id="results"></div></div>
</main>
<footer><div class="wrap">回は日本語版の通算回、話数はシーズン内の番号です。あらすじと分類（学びの分野・困りごと・季節・家でできること）は公開情報をもとにした独自のまとめで、公式の分類ではありません。「見た」「お気に入り」はこの端末のブラウザにだけ保存されます。</div></footer>

function card(d) {
  const seen = store.seen.includes(d.c), fav = store.fav.includes(d.c);
  const pl = P.filter(p => d.P.includes(p[0])).map(p => `<span class="tag">${p[1]}</span>`).join("");
  return `<article class="card" id="c-${d.c}">
<div class="meta"><b>${d.c}</b><span>第${d.k}回</span><span>${d.a}</span><span>${esc(d.b)}</span></div>
<h3>${esc(d.j)}</h3><div class="en">${esc(d.e)}</div>
<p class="theme">${esc(d.t)}</p><p class="syn">${esc(d.y)}</p>
<div class="tags">${pl}${d.m?`<span class="tag">${esc(d.m)}</span>`:""}${d.n?`<span class="tag">${esc(d.n)}</span>`:""}</div>
${d.p?`<p class="note"><b>こんなときに</b>${esc(d.p)}</p>`:""}
${d.h?`<p class="note"><b>見たあとに</b>${esc(d.h)}</p>`:""}
${d.r?`<div class="meta">登場：${esc(d.r)}</div>`:""}
${pv(d)}
<div class="act"><button data-a="seen" data-c="${d.c}" aria-pressed="${seen}">${seen?"見た":"見たら押す"}</button><button data-a="fav" data-c="${d.c}" aria-pressed="${fav}">${fav?"お気に入り済み":"お気に入り"}</button></div>
</article>`;
}
let shown = [];
function render() {
  $("purposes").innerHTML = chipsHTML(P, st.pur, "pur", d => d.P);
  $("komari").innerHTML = chipsHTML(K, st.kom, "kom", d => d.K);
  $("season").innerHTML = chipsHTML(S, st.sea, "sea", d => d.S);
  shown = D.filter(d => match(d));
  if (st.sort==="new") shown.reverse();
  if (st.sort==="rnd") shown.sort(() => Math.random() - .5);
  $("count").innerHTML = `${shown.length}話<small> 見つかりました</small>`;
  $("results").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty">条件に合う話がありません。条件を少し減らしてみてください。</div>`;
  $("pick").disabled = !shown.length;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) { const set = {pur:st.pur, kom:st.kom, sea:st.sea}[b.dataset.k];
    set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v); render(); return; }
  if (b.dataset.a) { const arr = store[b.dataset.a], c = b.dataset.c, i = arr.indexOf(c);
    i < 0 ? arr.push(c) : arr.splice(i, 1); save();
    const on = i < 0; b.setAttribute("aria-pressed", on);
    b.textContent = b.dataset.a==="seen" ? (on?"見た":"見たら押す") : (on?"お気に入り済み":"お気に入り");
    if (st.unseen || st.fav) render(); return; }
});
const tg = (id, key) => $(id).addEventListener("click", () => { st[key] = !st[key]; $(id).setAttribute("aria-pressed", st[key]); render(); });
tg("tHome","home"); tg("tWorld","world"); tg("tUnseen","unseen"); tg("tFav","fav");
let tmr; $("q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 150); });
["age","chr","ssn","sort"].forEach(id => $(id).addEventListener("change", e => { st[id] = e.target.value; render(); }));
$("pick").addEventListener("click", () => {
  if (!shown.length) return;
  const d = shown[Math.floor(Math.random() * shown.length)], el = $("c-" + d.c);
  document.querySelectorAll(".card.hl").forEach(x => x.classList.remove("hl"));
  if (el) { el.classList.add("hl"); el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"}); }
});
$("clear").addEventListener("click", () => {
  st.pur.clear(); st.kom.clear(); st.sea.clear(); Object.assign(st, {q:"", age:"", chr:"", ssn:"", home:false, world:false, unseen:false, fav:false});
  $("q").value = ""; ["age","chr","ssn"].forEach(id => $(id).value = "");
  ["tHome","tWorld","tUnseen","tFav"].forEach(id => $(id).setAttribute("aria-pressed", "false")); render();
});
render();
}
</script>
</body>
</html>
